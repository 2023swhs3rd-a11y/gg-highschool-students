name: 자료 갱신 (스프레드시트 → data/db.json)

# 스프레드시트에서 수집·보정을 마친 뒤 Actions 탭에서 [Run workflow]를 누르면 실행됩니다.
# 매월 2일 오전 6시(한국시간)에도 한 번 확인하며, 바뀐 내용이 없으면 아무것도 하지 않습니다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 1 * *"   # 매월 1일 21:00 UTC = 2일 06:00 KST

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 스프레드시트에서 db.json 만들기
        run: python scripts/build_data.py

      - name: 바뀐 경우에만 커밋
        id: commit
        run: |
          if git diff --quiet -- data/db.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          git commit -m "자료 갱신: 스프레드시트 DB 시트 → data/db.json"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Actions가 만든 커밋은 Pages 재배포를 자동으로 일으키지 않으므로 직접 요청
      - name: 사이트 다시 배포 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
